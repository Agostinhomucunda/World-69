name: Atualizar Radar World 69

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: world69-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar fontes públicas, normalizar e deduplicar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          GREENHOUSE_BOARDS: ${{ vars.GREENHOUSE_BOARDS }}
        run: python3 scripts/update_radar.py
      - name: Guardar feed atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.generated.json radar-details.generated.json
          if git diff --cached --quiet; then
            echo "O feed e o estado das fontes não mudaram."
            exit 0
          fi
          git commit -m "Refresh Radar opportunities feed"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
