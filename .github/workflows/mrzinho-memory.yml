name: Atualizar memória pedagógica do MrZinho

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world69-mrzinho-memory
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar fontes oficiais
        run: python3 scripts/update_mrzinho.py
      - name: Guardar memória atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mrzinho-knowledge.generated.json mrzinho-knowledge.generated.js
          if git diff --cached --quiet; then
            echo "A memória não mudou."
            exit 0
          fi
          git commit -m "Refresh Mrzinho teaching memory"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
