<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | World 69</title>
<link rel="stylesheet" href="admin.css">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_FrApgE4TYfrBnq4urrWac9oiLavecMg",
  authDomain: "world-69.firebaseapp.com",
  projectId: "world-69"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Check Firebase Authentication state
onAuthStateChanged(auth, (user) => {
  if (user) {
    // User is authenticated — show admin panel
    document.getElementById("admin-content").style.display = "block";
    document.getElementById("loading-msg").style.display = "none";
    document.getElementById("user-email").textContent = user.email;
    loadProducts();
  } else {
    // Not authenticated — redirect to login
    window.location.href = "login.html";
  }
});

// LOGOUT
window.logout = async () => {
  try {
    await signOut(auth);
    window.location.href = "login.html";
  } catch (e) {
    alert("Erro ao sair: " + e);
  }
};

// ADICIONAR PRODUTO
window.addProduct = async () => {
  const name = document.getElementById("name").value.trim();
  const image = document.getElementById("image").value.trim();
  const desc = document.getElementById("desc").value.trim();
  const link = document.getElementById("link").value.trim();
  const type = document.getElementById("type").value;
  const category = document.getElementById("category").value;

  if(!name || !image || !desc || !link || !category){
    alert("Preencha todos os campos!");
    return;
  }

  try {
    await addDoc(collection(db, "products"), {
      name: name,
      image: image,
      description: desc,
      link: link,
      type: type,
      category: category
    });
    alert("Produto publicado com sucesso!");
    document.getElementById("admin-form").reset();
    loadProducts(); // Recarrega lista
  } catch(e){
    alert("Erro ao publicar: " + e);
  }
};

// CARREGA PRODUTOS PARA EDIÇÃO/DELEÇÃO
async function loadProducts(){
  const list = document.getElementById("products-list");
  list.innerHTML = "";
  const snap = await getDocs(collection(db, "products"));
  snap.forEach(docSnap => {
    const p = docSnap.data();
    const div = document.createElement("div");
    div.classList.add("product-item");
    div.innerHTML = `
      <strong>${p.name}</strong> [${p.type.toUpperCase()} - ${p.category}]
      <button onclick="deleteProduct('${docSnap.id}')">Deletar</button>
    `;
    list.appendChild(div);
  });
}

// DELETAR PRODUTO
window.deleteProduct = async (id) => {
  if(confirm("Tem certeza que quer deletar este produto?")){
    try {
      await deleteDoc(doc(db, "products", id));
      alert("Produto deletado com sucesso!");
      loadProducts();
    } catch(e){
      alert("Erro ao deletar: " + e);
    }
  }
};
</script>

<style>
body { background:#050505; color:#fff; font-family:'Segoe UI',sans-serif; padding:20px;}
h1 { text-align:center; color:#00ff5a; margin-bottom:20px; animation: glow 2s infinite;}
@keyframes glow {0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}

.admin-bar {
  max-width:500px; margin:0 auto 15px; display:flex; justify-content:space-between; align-items:center;
  background:#111; padding:10px 15px; border-radius:6px; font-size:13px;
}
.admin-bar span { color:#aaa; }
.admin-bar button {
  background:#ff4d4d; color:#fff; border:none; padding:6px 14px; border-radius:4px;
  cursor:pointer; font-weight:bold; font-size:12px; transition: transform .2s;
}
.admin-bar button:hover { transform:scale(1.05); }

#admin-form { max-width:500px; margin:0 auto; }
#admin-form input, #admin-form textarea, #admin-form select, #admin-form button {
  width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:none; font-size:14px;
}
#admin-form textarea { height:80px; resize:none; }

#admin-form button {
  background:#00ff5a; color:#000; font-weight:bold; cursor:pointer;
  transition: transform .2s;
}
#admin-form button:hover { transform:scale(1.05); }

#products-list { max-width:500px; margin:20px auto; }
.product-item {
  background:#111; padding:10px; margin-bottom:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;
}
.product-item button {
  background:#ff0000; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;
  transition: transform .2s;
}
.product-item button:hover { transform:scale(1.05); }

#loading-msg {
  text-align:center; padding:50px; color:#aaa; font-size:16px;
}

@media (max-width:480px){
  body { padding:10px;}
  #admin-form, #products-list, .admin-bar { width:95%; }
}
</style>

</head>
<body>

<h1>World 69 — Admin</h1>

<!-- Loading state while checking auth -->
<div id="loading-msg">Verificando autenticação...</div>

<!-- Admin content (hidden until authenticated) -->
<div id="admin-content" style="display:none;">

  <!-- User bar with email and logout -->
  <div class="admin-bar">
    <span id="user-email"></span>
    <button onclick="logout()">SAIR</button>
  </div>

  <!-- FORMULÁRIO DE PRODUTOS -->
  <form id="admin-form" onsubmit="event.preventDefault(); addProduct();">
    <input id="name" type="text" placeholder="Nome do produto">
    <input id="image" type="text" placeholder="Link da imagem">
    <textarea id="desc" placeholder="Descrição completa"></textarea>
    <input id="link" type="text" placeholder="Link Google Drive ou WhatsApp">

    <select id="type">
      <option value="free">Grátis</option>
      <option value="paid">Pago</option>
    </select>

    <select id="category">
      <option value="SCRIPTS">SCRIPTS</option>
      <option value="SITES">SITES</option>
      <option value="APPS">APPS</option>
      <option value="SNI">SNI</option>
      <option value="BOOKS">BOOKS</option>
      <option value="RAROS">RAROS</option>
      <option value="BOTS">BOTS</option>
      <option value="HAKS">HAKS</option>
    </select>

    <button type="submit">PUBLICAR</button>
  </form>

  <!-- LISTA DE PRODUTOS -->
  <div id="products-list"></div>

</div>

</body>
</html>
