<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin | World 69</title>
<link rel="stylesheet" href="admin.css">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_FrApgE4TYfrBnq4urrWac9oiLavecMg",
  authDomain: "world-69.firebaseapp.com",
  projectId: "world-69"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.send = async () => {
  await addDoc(collection(db,"products"),{
    name:nome.value,
    image:img.value,
    description:desc.value,
    link:link.value,
    type:tipo.value,
    category:cat.value
  });
  alert("Produto publicado com sucesso!");
};
</script>
</head>

<body>

<h1>World 69 — Admin</h1>

<input id="nome" placeholder="Nome do produto">
<input id="img" placeholder="Link da imagem">
<textarea id="desc" placeholder="Descrição completa"></textarea>
<input id="link" placeholder="Link Google Drive">

<select id="tipo">
  <option value="free">Grátis</option>
  <option value="paid">Pago</option>
</select>

<select id="cat">
  <option>SCRIPTS</option>
  <option>SITES</option>
  <option>APPS</option>
  <option>SNI</option>
  <option>BOOKS</option>
  <option>RAROS</option>
  <option>BOTS</option>
  <option>HAKS</option>
</select>

<button onclick="send()">PUBLICAR</button>

</body>
</html>
