<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | World 69</title>

<style>
body {
  margin: 0;
  background: #050505;
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

@keyframes glow {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

.login-container {
  background: #0f0f0f;
  padding: 30px;
  border-radius: 10px;
  width: 90%;
  max-width: 400px;
  text-align: center;
}

.login-container h1 {
  color: #00ff5a;
  font-size: 32px;
  margin: 0 0 5px;
  animation: glow 2s infinite;
}

.login-container .subtitle {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 25px;
}

.login-container input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
  box-sizing: border-box;
  background: #1a1a1a;
  color: #fff;
}

.login-container input::placeholder {
  color: #777;
}

.login-container input:focus {
  outline: 2px solid #00ff5a;
  outline-offset: -2px;
}

.login-container button {
  width: 100%;
  padding: 12px;
  background: #00ff5a;
  color: #000;
  font-weight: bold;
  font-size: 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.2s;
  margin-top: 5px;
}

.login-container button:hover {
  transform: scale(1.05);
}

.login-container button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.error-msg {
  color: #ff4d4d;
  font-size: 13px;
  margin-top: 10px;
  min-height: 20px;
}
</style>

</head>
<body>

<div class="login-container">
  <h1>World 69</h1>
  <p class="subtitle">Admin Login</p>

  <form id="login-form">
    <input id="email" type="email" placeholder="Email" required autocomplete="email">
    <input id="password" type="password" placeholder="Senha" required autocomplete="current-password">
    <button type="submit" id="login-btn">ENTRAR</button>
  </form>

  <p class="error-msg" id="error-msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_FrApgE4TYfrBnq4urrWac9oiLavecMg",
  authDomain: "world-69.firebaseapp.com",
  projectId: "world-69"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// If already authenticated, redirect to admin
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = "admin.html";
  }
});

const form = document.getElementById("login-form");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("login-btn");
const errorMsg = document.getElementById("error-msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.textContent = "";
  loginBtn.disabled = true;
  loginBtn.textContent = "ENTRANDO...";

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "admin.html";
  } catch (err) {
    let message = "Erro ao fazer login.";
    if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
      message = "Email ou senha incorretos.";
    } else if (err.code === "auth/invalid-email") {
      message = "Email inválido.";
    } else if (err.code === "auth/too-many-requests") {
      message = "Muitas tentativas. Tente novamente mais tarde.";
    }
    errorMsg.textContent = message;
    loginBtn.disabled = false;
    loginBtn.textContent = "ENTRAR";
  }
});
</script>

</body>
</html>
