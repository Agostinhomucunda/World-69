<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0d"><title>Entrar — World 69</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.login-wrap{width:min(960px,100%);display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}.login-intro{padding:58px 48px;background:linear-gradient(140deg,#17231a,#11151a 55%);display:flex;flex-direction:column;justify-content:space-between}.login-intro h1{font:600 clamp(42px,5vw,70px)/.95 'Space Grotesk';letter-spacing:-.07em;margin:65px 0 22px}.login-intro h1 em{color:var(--lime);font-style:normal}.login-intro p{color:var(--muted);max-width:290px;font-size:13px;line-height:1.7}.login-tip{color:var(--lime);font:10px 'DM Mono';letter-spacing:.08em}.login-form{padding:58px 48px;display:flex;flex-direction:column;justify-content:center}.login-form h2{font:600 32px 'Space Grotesk';margin:0 0 8px}.login-form>p{color:var(--muted);font-size:13px;margin-bottom:30px}.field{display:block;color:var(--muted);font:10px 'DM Mono';text-transform:uppercase;letter-spacing:.1em;margin-bottom:17px}.field input{display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;background:#0b0e11;color:var(--text);font:13px 'Plus Jakarta Sans';padding:14px;outline:0}.field input:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(183,255,60,.12)}.login-form button{width:100%;margin-top:7px}.login-back{display:inline-block;color:var(--muted);font:11px 'DM Mono';margin-top:23px}.login-back:hover{color:var(--lime)}.error-msg{min-height:20px;color:var(--danger);font-size:12px;margin:15px 0 0!important}@media(max-width:700px){.login-wrap{grid-template-columns:1fr}.login-intro{padding:35px 27px}.login-intro h1{margin:45px 0 15px}.login-form{padding:35px 27px}}</style></head><body><main class="login-wrap"><section class="login-intro"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><span><strong>WORLD 69</strong><small>digital discovery</small></span></a><div><p class="eyebrow">área reservada</p><h1>Menos cliques.<br><em>Mais alcance.</em></h1><p>Publica e gere os teus produtos premium no catálogo World 69.</p></div><span class="login-tip">01 / ADMIN ACCESS</span></section><section class="login-form"><p class="eyebrow">02 / autenticação</p><h2>Bem-vindo de volta.</h2><p>Entra para gerir a tua coleção premium.</p><form id="login-form"><label class="field" for="email">Email<input id="email" name="email" type="email" placeholder="nome@exemplo.com" required autocomplete="email"></label><label class="field" for="password">Senha<input id="password" name="password" type="password" placeholder="A tua senha" required autocomplete="current-password"></label><button class="button button-primary" type="submit" id="login-btn">Entrar <span>→</span></button><p class="error-msg" id="error-msg" role="alert"></p></form><a class="login-back" href="index.html">← Voltar ao catálogo</a></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';import{firebaseConfig}from'./firebase-config.js';const auth=getAuth(initializeApp(firebaseConfig)),form=document.querySelector('#login-form'),email=document.querySelector('#email'),password=document.querySelector('#password'),btn=document.querySelector('#login-btn'),error=document.querySelector('#error-msg');onAuthStateChanged(auth,user=>{if(user)location.href='admin.html'});form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';btn.disabled=true;btn.textContent='A validar…';try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);location.href='admin.html'}catch(err){error.textContent=err.code==='auth/invalid-email'?'Email inválido.':err.code==='auth/too-many-requests'?'Muitas tentativas. Tenta mais tarde.':'Email ou senha incorretos.';btn.disabled=false;btn.innerHTML='Entrar <span>→</span>'}});</script></body></html>
